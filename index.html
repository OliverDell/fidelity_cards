<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cartes">
<meta name="theme-color" content="#f5f5f7">
<link rel="manifest" href="manifest.webmanifest">
<title>Mes cartes</title>
<style>
:root{color-scheme:light dark;--bg:#f5f5f7;--fg:#1c1c1e;--mut:#8e8e93;--card:#fff;--acc:#0a84ff;--warn:#c93400;--ok:#248a3d}
@media (prefers-color-scheme:dark){:root{--bg:#000;--fg:#f2f2f7;--card:#1c1c1e}}
*{box-sizing:border-box}
body{margin:0;font:16px -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--fg);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:1;background:var(--bg);padding:12px 16px;display:flex;gap:8px;align-items:center}
header input{flex:1;min-width:0;padding:10px 12px;border:0;border-radius:10px;background:var(--card);color:var(--fg);font:inherit}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--acc);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--acc)}
button.danger{background:var(--warn)}
ul{list-style:none;margin:0;padding:0 16px 40px}
li{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.pastille{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:14px}
.txt{display:flex;flex-direction:column;min-width:0}
.txt small{color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--mut);text-align:center;padding:40px 0}
dialog{border:0;border-radius:16px;width:min(92vw,420px);background:var(--bg);color:var(--fg);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.4)}
h2{margin:0 0 12px;font-size:20px}
.scan{background:#fff;color:#000;border-radius:12px;padding:8px}
.scan svg,.scan img{width:100%;max-height:45vh;object-fit:contain;display:block}
.big{font:600 26px ui-monospace,monospace;text-align:center;padding:24px 8px;word-break:break-all}
label{display:block;margin:12px 0 4px;color:var(--mut);font-size:14px}
input{width:100%;padding:10px;border-radius:10px;border:1px solid #888;font:inherit;background:var(--card);color:var(--fg)}
.msg{font-size:14px;min-height:20px;margin:6px 0 0}
.ok{color:var(--ok)}
.warn{color:var(--warn)}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.row.left{justify-content:flex-start}
.grp{background:var(--card);border-radius:10px;padding:10px;margin-bottom:8px}
.grp .line{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:8px}
</style>
</head>
<body>

<header>
  <input id="q" type="search" placeholder="Rechercher" aria-label="Rechercher">
  <button id="add" aria-label="Ajouter une carte">+</button>
  <button id="settingsBtn" class="ghost" aria-label="Paramètres">⚙︎</button>
</header>
<ul id="list"></ul>

<dialog id="detail">
  <div id="detailBody"></div>
  <div class="row">
    <button class="ghost" id="dEdit">Modifier</button>
    <button class="danger" id="dDel">Supprimer</button>
    <button id="dClose">Fermer</button>
  </div>
</dialog>

<dialog id="form">
  <h2 id="formTitle">Nouvelle carte</h2>
  <label for="fBrand">Enseigne</label>
  <input id="fBrand" list="brands" autocomplete="off">
  <datalist id="brands"></datalist>
  <label for="fLabel">Libellé (facultatif)</label>
  <input id="fLabel" autocomplete="off">
  <label for="fCode">Numéro du code-barres (facultatif si image)</label>
  <input id="fCode" inputmode="numeric" autocomplete="off">
  <div class="msg" id="fMsg"></div>
  <div id="fPreview"></div>
  <label for="fImg">Image (QR ou code illisible)</label>
  <input id="fImg" type="file" accept="image/*">
  <div class="row">
    <button class="ghost" id="fCancel">Annuler</button>
    <button id="fSave">Enregistrer</button>
  </div>
</dialog>

<dialog id="settings">
  <h2>Paramètres</h2>
  <div class="row left">
    <button id="exp">Exporter</button>
    <button id="impBtn" class="ghost">Importer</button>
    <input id="impFile" type="file" accept="application/json,.json" hidden>
  </div>
  <div class="row left">
    <button id="dupBtn" class="ghost">Rechercher les doublons</button>
  </div>
  <div id="dupList"></div>
  <div class="row">
    <button id="sClose">Fermer</button>
  </div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const KEY = 'cartes-fidelite-v1';
let cards = [];
try { cards = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { cards = []; }
let viewId = null;
let editingId = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').trim().toLowerCase().replace(/\s+/g, ' ');
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(cards)); }
  catch { alert("Mémoire de l'app pleine. Exportez vos cartes puis supprimez les images inutiles."); }
}

/* ---------- Codes-barres : encodage maison, sans bibliothèque ---------- */
const L = ['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
const G = ['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
const R = ['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
const PARITY = ['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
const ITF = ['00110','10001','01001','11000','00101','10100','01100','00011','10010','01010'];

function checkDigit(data) {
  let s = 0;
  for (let i = 0; i < data.length; i++) {
    const n = +data[data.length - 1 - i];
    s += i % 2 === 0 ? n * 3 : n;
  }
  return (10 - (s % 10)) % 10;
}
function encEAN13(d) {
  const p = PARITY[+d[0]];
  let m = '101';
  for (let i = 1; i <= 6; i++) m += p[i - 1] === 'L' ? L[+d[i]] : G[+d[i]];
  m += '01010';
  for (let i = 7; i <= 12; i++) m += R[+d[i]];
  return m + '101';
}
function encEAN8(d) {
  let m = '101';
  for (let i = 0; i < 4; i++) m += L[+d[i]];
  m += '01010';
  for (let i = 4; i < 8; i++) m += R[+d[i]];
  return m + '101';
}
function encITF(d) {
  let m = '1010';
  for (let i = 0; i < 14; i += 2) {
    const bars = ITF[+d[i]], spaces = ITF[+d[i + 1]];
    for (let k = 0; k < 5; k++) {
      m += bars[k] === '1' ? '111' : '1';
      m += spaces[k] === '1' ? '000' : '0';
    }
  }
  return m + '11101';
}
function modulesFor(d) {
  if (d.length === 8) return encEAN8(d);
  if (d.length === 12) return encEAN13('0' + d);
  if (d.length === 13) return encEAN13(d);
  return encITF(d);
}
function analyse(raw) {
  const d = (raw || '').replace(/[\s-]/g, '');
  if (!d) return { ok: false, empty: true, d };
  if (!/^\d+$/.test(d)) return { ok: false, d, msg: 'Seuls les chiffres sont acceptés.' };
  const fmt = { 8: 'EAN-8', 12: 'UPC-A', 13: 'EAN-13', 14: 'GTIN-14' }[d.length];
  if (!fmt) return { ok: false, d, msg: `${d.length} chiffres : aucun format standard.` };
  const cd = checkDigit(d.slice(0, -1));
  if (cd !== +d.slice(-1)) return { ok: false, d, msg: `Chiffre de contrôle incorrect (attendu : ${cd}).` };
  return { ok: true, d, fmt };
}
function barcodeSVG(modules, human) {
  const q = 10, w = modules.length + 2 * q;
  let rects = '', i = 0;
  while (i < modules.length) {
    if (modules[i] === '1') {
      let j = i;
      while (j < modules.length && modules[j] === '1') j++;
      rects += `<rect x="${i + q}" y="0" width="${j - i}" height="100"/>`;
      i = j;
    } else i++;
  }
  return `<svg viewBox="0 0 ${w} 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${human}">` +
    `<rect width="${w}" height="120" fill="#fff"/><g fill="#000">${rects}</g>` +
    `<text x="${w / 2}" y="115" text-anchor="middle" font-family="monospace" font-size="12" fill="#000">${human}</text></svg>`;
}

/* ---------- Doublons ---------- */
function findDup(brand, code, exceptId) {
  if (!code) return null;
  return cards.find(c => c.id !== exceptId && c.code && norm(c.brand) === norm(brand) && c.code === code) || null;
}

/* ---------- Liste ---------- */
function hue(s) { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h % 360; }
function initials(b) {
  const w = b.trim().split(/\s+/);
  return (w.length > 1 ? w[0][0] + w[1][0] : b.trim().slice(0, 2)).toUpperCase();
}
function renderList() {
  const q = norm($('q').value);
  const list = cards
    .filter(c => !q || norm(c.brand + ' ' + (c.label || '') + ' ' + (c.code || '')).includes(q))
    .sort((a, b) => norm(a.brand).localeCompare(norm(b.brand), 'fr') || norm(a.label).localeCompare(norm(b.label), 'fr'));
  $('list').innerHTML = list.map(c =>
    `<li data-id="${c.id}"><span class="pastille" style="background:hsl(${hue(c.brand + '|' + (c.label || ''))} 55% 42%)">${esc(initials(c.brand))}</span>` +
    `<span class="txt"><b>${esc(c.brand)}</b><small>${esc(c.label || '')}</small></span></li>`
  ).join('') || '<p class="empty">Aucune carte</p>';
}

/* ---------- Détail ---------- */
function openDetail(id) {
  const c = cards.find(x => x.id === id);
  if (!c) return;
  viewId = id;
  let body = '';
  if (c.image) body = `<img src="${c.image}" alt="">`;
  else if (c.code) {
    const a = analyse(c.code);
    body = a.ok
      ? barcodeSVG(modulesFor(a.d), a.d)
      : `<div class="big">${esc(c.code)}</div><p class="msg warn">Format non standard : affichage en texte.</p>`;
  }
  $('detailBody').innerHTML =
    `<h2>${esc(c.brand)}</h2><p style="margin:0 0 12px;color:var(--mut)">${esc(c.label || '')}</p>` +
    `<div class="scan">${body}</div>`;
  $('detail').showModal();
}

/* ---------- Formulaire ---------- */
function fillBrands() {
  const names = [...new Set(cards.map(c => c.brand.trim()))].sort((a, b) => a.localeCompare(b, 'fr'));
  $('brands').innerHTML = names.map(n => `<option value="${esc(n)}">`).join('');
}
function updateForm() {
  const d = $('fCode').value.replace(/[\s-]/g, '');
  const a = analyse(d);
  const msg = $('fMsg');
  if (a.empty) { msg.textContent = ''; msg.className = 'msg'; $('fPreview').innerHTML = ''; return; }
  if (a.ok) {
    msg.textContent = `${a.fmt} : chiffre de contrôle valide`;
    msg.className = 'msg ok';
    $('fPreview').innerHTML = `<div class="scan" style="margin-top:8px">${barcodeSVG(modulesFor(a.d), a.d)}</div>`;
  } else {
    msg.textContent = a.msg;
    msg.className = 'msg warn';
    $('fPreview').innerHTML = '';
  }
}
function openForm(c) {
  editingId = c ? c.id : null;
  $('formTitle').textContent = c ? 'Modifier la carte' : 'Nouvelle carte';
  $('fBrand').value = c ? c.brand : '';
  $('fLabel').value = c ? (c.label || '') : '';
  $('fCode').value = c ? (c.code || '') : '';
  $('fImg').value = '';
  fillBrands();
  updateForm();
  $('form').showModal();
}
function shrink(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, 700 / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * s);
        cv.height = Math.round(img.height * s);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        resolve(cv.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = reject;
      img.src = fr.result;
    };
    fr.onerror = reject;
    fr.readAsDataURL(file);
  });
}
async function saveForm() {
  const brand = $('fBrand').value.trim();
  const label = $('fLabel').value.trim();
  const d = $('fCode').value.replace(/[\s-]/g, '');
  const file = $('fImg').files[0];
  const ed = editingId ? cards.find(c => c.id === editingId) : null;
  if (!brand) { alert('Indiquez une enseigne.'); return; }

  let code = null;
  if (d) {
    if (!/^\d+$/.test(d)) { alert('Le code ne doit contenir que des chiffres.'); return; }
    code = d;
    const a = analyse(d);
    if (!a.ok && !confirm(`Ce numéro n'est pas un code standard (${a.msg})\nL'enregistrer quand même en texte ?`)) return;
  }
  let image = ed ? (ed.image || null) : null;
  if (file) {
    try { image = await shrink(file); }
    catch { alert("Image illisible."); return; }
  }
  if (!code && !image) { alert('Indiquez un numéro de code ou une image.'); return; }

  const dup = findDup(brand, code, editingId);
  if (dup && !confirm(`Doublon : « ${dup.brand} » avec ce même code existe déjà (libellé : « ${dup.label || 'aucun'} »).\nLibellé de la nouvelle carte : « ${label || 'aucun'} ».\nEnregistrer quand même ?`)) return;

  if (ed) Object.assign(ed, { brand, label, code, image });
  else cards.push({ id: newId(), brand, label, code, image });
  persist();
  renderList();
  $('form').close();
}

/* ---------- Export / import / doublons ---------- */
async function exportCards() {
  const payload = { app: 'cartes-fidelite', version: 1, exported: new Date().toISOString(), cards };
  const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
  const name = `cartes-${new Date().toISOString().slice(0, 10)}.json`;
  const file = new File([blob], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'Mes cartes' }); } catch {}
  } else {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
  }
}
async function importFile(file) {
  let data;
  try { data = JSON.parse(await file.text()); }
  catch { alert('Fichier illisible.'); return; }
  const list = Array.isArray(data) ? data : data.cards;
  if (!Array.isArray(list)) { alert('Format non reconnu.'); return; }
  let added = 0;
  const skipped = [];
  for (const c of list) {
    if (!c || typeof c.brand !== 'string' || !c.brand.trim()) continue;
    const brand = c.brand.trim();
    const code = c.code ? String(c.code).replace(/[\s-]/g, '') : null;
    const dup = findDup(brand, code);
    if (dup) {
      skipped.push(`${brand} : « ${c.label || 'aucun'} » ignorée (existe déjà sous « ${dup.label || 'aucun'} »)`);
      continue;
    }
    cards.push({ id: newId(), brand, label: (c.label || '').trim(), code, image: c.image || null });
    added++;
  }
  persist();
  renderList();
  alert(`${added} carte(s) ajoutée(s).` + (skipped.length ? `\n${skipped.length} doublon(s) ignoré(s) :\n` + skipped.join('\n') : ''));
}
function showDuplicates() {
  const groups = {};
  for (const c of cards) {
    if (!c.code) continue;
    const k = norm(c.brand) + '|' + c.code;
    (groups[k] = groups[k] || []).push(c);
  }
  const dups = Object.values(groups).filter(g => g.length > 1);
  $('dupList').innerHTML = dups.length
    ? dups.map(g => `<div class="grp"><b>${esc(g[0].brand)}</b> ${esc(g[0].code)}` +
        g.map(c => `<div class="line"><span>libellé : ${esc(c.label || 'aucun')}</span><button class="danger" data-del="${c.id}">Supprimer</button></div>`).join('') +
        `</div>`).join('')
    : '<p class="msg">Aucun doublon.</p>';
}

/* ---------- Événements ---------- */
$('q').addEventListener('input', renderList);
$('add').onclick = () => openForm(null);
$('list').onclick = e => { const li = e.target.closest('li'); if (li) openDetail(li.dataset.id); };
$('dEdit').onclick = () => { $('detail').close(); openForm(cards.find(c => c.id === viewId)); };
$('dDel').onclick = () => {
  if (!confirm('Supprimer cette carte ?')) return;
  cards = cards.filter(c => c.id !== viewId);
  persist(); renderList(); $('detail').close();
};
$('dClose').onclick = () => $('detail').close();

$('fCode').addEventListener('input', updateForm);
$('fSave').onclick = saveForm;
$('fCancel').onclick = () => $('form').close();

$('settingsBtn').onclick = () => { $('dupList').innerHTML = ''; $('settings').showModal(); };
$('exp').onclick = exportCards;
$('impBtn').onclick = () => $('impFile').click();
$('impFile').onchange = e => { if (e.target.files[0]) importFile(e.target.files[0]); e.target.value = ''; };
$('dupBtn').onclick = showDuplicates;
$('dupList').onclick = e => {
  const id = e.target.dataset.del;
  if (!id || !confirm('Supprimer cette carte ?')) return;
  cards = cards.filter(c => c.id !== id);
  persist(); renderList(); showDuplicates();
};
$('sClose').onclick = () => $('settings').close();

renderList();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
